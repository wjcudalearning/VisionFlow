name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  cpu-static:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect documentation-only changes
        id: changes
        uses: actions/github-script@v9
        with:
          script: |
            let paths = [];
            if (context.eventName === 'pull_request') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
              paths = files.map(file => file.filename);
            } else if (context.eventName === 'push' && context.payload.before && !/^0+$/.test(context.payload.before)) {
              const diff = await exec.getExecOutput('git', [
                'diff', '--name-only', `${context.payload.before}..${context.sha}`,
              ], {ignoreReturnCode: true});
              if (diff.exitCode === 0) paths = diff.stdout.trim().split(/\r?\n/).filter(Boolean);
            } else {
              paths = ['run-all'];
            }
            const isDocumentation = path => {
              const lower = path.toLowerCase();
              return lower.startsWith('docs/') || lower.startsWith('documentation/') ||
                lower.startsWith('.github/issue_template/') ||
                ['.md', '.rst', '.adoc'].includes(path.slice(path.lastIndexOf('.')).toLowerCase());
            };
            const docsOnly = paths.length > 0 && paths.every(isDocumentation);
            core.setOutput('run_validation', docsOnly ? 'false' : 'true');
            if (docsOnly) core.notice(`Skipping source validation for ${paths.length} documentation-only file(s).`);
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.run_validation == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install dependencies
        if: steps.changes.outputs.run_validation == 'true'
        run: python -m pip install -r requirements.lock.txt
      - name: Unit tests
        if: steps.changes.outputs.run_validation == 'true'
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        if: steps.changes.outputs.run_validation == 'true'
        run: >-
          python -m compileall
          main.py
          gui_launcher.py
          tools
          core
          detectors
          devices
          gui
          gpu
      - name: Validate CUDA headers and source contract
        if: steps.changes.outputs.run_validation == 'true'
        run: python gpu/preflight_cuda_build.py
      - name: Recipe and CLI smoke
        if: steps.changes.outputs.run_validation == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force outputs_validation | Out-Null
          python -c "import cv2,numpy as np; cv2.imwrite('outputs_validation/ci_input.png', np.zeros((128,128,3),np.uint8))"
          python main.py --image outputs_validation/ci_input.png --recipe recipes/PRODUCT_A_NEGATIVE_401_AOI_01.yaml --output outputs_validation/ci_cli
          $cliExitCode = $LASTEXITCODE
          if ($cliExitCode -notin @(0, 2)) { exit $cliExitCode }
          exit 0
      - name: GUI offscreen smoke
        if: steps.changes.outputs.run_validation == 'true'
        shell: pwsh
        run: python -c "from pathlib import Path; from PySide6.QtWidgets import QApplication; from gui.main_window import MainWindow; app=QApplication([]); w=MainWindow(); w.recipe_panel.load_recipe(Path('recipes/PRODUCT_A_AOI_01.yaml')); assert w.recipe_panel.detector_list.count() > 0"
      - name: Upload static validation artifacts
        if: always() && steps.changes.outputs.run_validation == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-static-${{ github.sha }}
          path: |
            gpu/include/
            outputs_validation/cuda_build_preflight.json
            outputs_validation/ci_cli/
          if-no-files-found: warn
